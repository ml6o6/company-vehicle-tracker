{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учет автомобилей{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3">
            <a class="site-brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.svg' %}"
                    alt="Логотип сервиса учета автомобилей"
                    class="site-logo"
                    width="120"
                    height="64"
                >
                <span>Учет автомобилей</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer">
        <p>© <span id="current-year"></span> Сервис учета автомобилей организации</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
